<script>
'use strict';
// =====================================================================
//  CIRCUIT DROP - roguelike prototype
//  Connect the + wall (left) to the - wall (right) with falling pipe tiles.
//  A run = 9 stages. Each stage has a score goal. Spend sparks on perks between stages.
// =====================================================================

// ---- Tunables -------------------------------------------------------
const COLS = 7, ROWS = 12, T = 52;       // grid size and tile size (px)
const WALL = 52, PANEL = 220;            // layout
const BASE_CHARGES = 2;                  // banked power-ups (Capacitor Bank perk adds more)
const CHARGE_BASE = 2, CHARGE_PER_LINK = 5, CHARGE_PER_CIRCUIT = 20;
const CHARGE_MERCY = 1.5;                // charge multiplier while the stack is dangerously high
const SPARK_MS = 70;                     // spark speed along a closed circuit
const LOCK_DELAY = 450;                  // ms before a resting tile locks
const SETTLE_SPEED = 0.014;              // rows/ms for tiles falling after a clear

// ---- Run structure (tune these first when balancing) ----------------
const GOALS = [250, 350, 450, 600, 750, 950, 1200, 1500, 1500];   // score per stage; the last is the boss
const STAGES = GOALS.length;
const START_FUSES = 3;
// Balance knobs in one place. mercy[stage-1] = how many candidate tiles are drawn, keeping the best fit (1 = pure random).
const BAL = { fuses: START_FUSES, riseEvery: 10, riseGaps: 2, insBase: 0.03, insStep: 0.018,

const STAGE_BONUS = 8, STAGE_BONUS_PER = 2;   // sparks for clearing a stage: 8 + 2 * stage
const SPARKS_PER_CIRCUIT = 2;                 // plus 1 per extra chain step
const ALL_CLEAR_MIN = 10, ALL_CLEAR_BASE = 100, ALL_CLEAR_PER = 40;   // emptying the board after clearing 10+ tiles
const OVERLOAD_ROWS = 4;                    // rows burned away when the stack overflows
const REPAIR_COST = 10, REPAIR_STEP = 4, REROLL_COST = 2;
const TIER_COST = { 1: 6, 2: 9, 3: 13 };
const TIER_WEIGHT = { 1: 3, 2: 2, 3: 1 };
const TIER_NAME = { 1: 'ЗВИЧАЙНИЙ', 2: 'НЕЗВИЧАЙНИЙ', 3: 'РІДКІСНИЙ' };
const TIER_COLOR = { 1: '#8b99b3', 2: '#6db4ff', 3: '#ffb347' };

// ---- Bosses, modifiers and heat -------------------------------------
const DEAD_ROW_FROM = 4;                      // dead rows are picked among rows DEAD_ROW_FROM..ROWS-1
const HEAT_MAX = 3, HEAT_GOAL = 0.15, HEAT_SPARKS = 0.15, HEAT_FROM_STAGE = 5;

const MODS = {

  machine:   { easy:   { mSteps: [4, 6], mAim: [2, 2], mCool: [3, 4], machines: 1 },

  scanner:   { easy: { deadRows: 2, scanEvery: 6 }, medium: { deadRows: 2, scanEvery: 6 }, hard: { deadRows: 3, scanEvery: 4 } },

// Each run rolls one boss per tier: stage 3 = easy, 6 = medium, 9 = hard. Medium and hard bosses also get a random extra skill.
const BOSS_TIER = { 3: 'easy', 6: 'medium', 9: 'hard' };
const BOSS_POOL = {
  easy: [
    { id: 'overvoltage', name: 'ПЕРЕНАПРУГА',    mods: ['rising'] },
    { id: 'drone',       name: 'ДРОН-НОВАЧОК',   mods: ['machine'] },
    { id: 'gust',        name: 'ПОРИВ',          mods: ['drift'] },
    { id: 'fog',         name: 'ТУМАН',          mods: ['fog'] },
    { id: 'slag',        name: 'ШЛАК',           mods: ['rain'] },
  ],

    { id: 'blackout',    name: 'ЗАТЕМНЕННЯ',     mods: ['fog', 'deadrows'] },
    { id: 'laser',       name: 'ЛАЗЕРНА МАШИНА', mods: ['machine'] },
    { id: 'frost',       name: 'МОРОЗ',          mods: ['frost'] },

    { id: 'rapid',       name: 'ШВИДКОСТРІЛ',    mods: ['machine'] },
    { id: 'timebomb',    name: 'БОМБА З ТАЙМЕРОМ', mods: ['timer', 'machine'], cfg: { mSteps: [3, 5], mAim: [1, 2], mCool: [2, 3] } },
    { id: 'meltdown',    name: 'ПЕРЕГРІВ',       mods: ['corrosion', 'drift'], cfg: { corrodeEvery: 12 } },
    { id: 'chaos',       name: 'ХАОС',           mods: ['static', 'drift', 'fog'] },
  ],
};
const EXTRA_SLOTS = { easy: 0, medium: 1, hard: 1 };
const EXTRA_POOL = {
  medium: ['rising', 'drift', 'rain', 'fog', 'deadrows', 'frost', 'corrosion'],
  hard:   ['rising', 'drift', 'rain', 'fog', 'deadrows', 'frost', 'corrosion', 'static', 'scanner', 'machine'],
};
function rollBoss(tier, forceId, forceExtras) {
  const pool = BOSS_POOL[tier];
  const def = forceId ? pool.find(b => b.id === forceId) : pool[(Math.random() * pool.length) | 0];
  const mods = def.mods.slice();
  if (forceExtras) mods.push(...forceExtras.filter(m => !mods.includes(m)));
  else for (let n = EXTRA_SLOTS[tier]; n > 0 && mods.length < 3; n--) {
    const cand = (EXTRA_POOL[tier] || []).filter(m => !mods.includes(m));
    if (cand.length) mods.push(cand[(Math.random() * cand.length) | 0]);
  }
  return { id: def.id, tier, name: def.name, mods, core: def.mods.length, cfg: def.cfg || {} };
}
function rollBosses() { const o = {}; for (const st in BOSS_TIER) o[st] = rollBoss(BOSS_TIER[st]); return o; }

// ---- Powers: the player equips 3 of these at the start of a run; each use costs one charge ----------
const POWER_ORDER = ['zap', 'swap', 'reroll', 'freeze', 'cross'];
const POWERS = {
  zap: {
    icon: '\u{1F4A5}', name: 'УДАР', desc: 'Знищує верхню плитку колонки, над якою ви стоїте.',
    usable: () => topInCol(cur.col) >= 0,
    use() {
      const r = topInCol(cur.col);
      grid[r][cur.col] = null;
      for (let y = cur.row; y <= r; y++) burst(WALL + (cur.col + 0.5) * T, (y + 0.5) * T, '#3de0d0', 3);
      popText('УДАР!', WALL + (cur.col + 0.5) * T, r * T + 10, '#3de0d0', 18);
      updateFlags(flood(true)); beep(900, 0.18, 'sawtooth', 0.04, -600);
    },
  },
  swap: {
    icon: '\u{1F500}', name: 'ОБМІН', desc: 'Оберіть плитку на полі стрілками, Enter: вона поміняється місцями з падаючою.',
    usable: () => anyTile(), deferCharge: true,           // the charge is spent when you confirm, not when you start choosing
    use() { startPick(); },
  },

    icon: '\u{1F3B2}', name: 'НОВА', desc: 'Замінює плитку, що падає, на найкращу з трьох нових.',
    usable: () => true,
    use() {
      let best = null, bf = -Infinity;
      for (let i = 0; i < 3; i++) { const t = drawNormal(), f = tileFit(t); if (f > bf) { bf = f; best = t; } }
      cur.tile = best;
      popText('НОВА', WALL + (cur.col + 0.5) * T, cur.row * T + 10, '#3de0d0', 18); beep(560, 0.12, 'triangle', 0.05, 300);
    },
  },
  freeze: {
    icon: '\u{1F9CA}', name: 'СТОП', desc: 'Зупиняє падіння на 6 секунд, а боси пропускають наступний хід.',
    usable: () => run.freezeT <= 0,
    use() {
      run.freezeT = 6000; run.skipTurn = true;
      popText('СТОП', WALL + BW / 2, 70, '#8fd8ff', 22); beep(300, 0.3, 'sine', 0.05, 200);
    },
  },
  cross: {
    icon: '\u271A', name: 'ХРЕСТ', desc: 'Перетворює плитку, що падає, на хрестовину.',
    usable: () => true,
    use() {
      const t = cur.tile; t.kind = 'normal'; t.mask = 15; t.hp = 1;
      popText('ХРЕСТ', WALL + (cur.col + 0.5) * T, cur.row * T + 10, '#3de0d0', 18); beep(700, 0.15, 'sine', 0.05, 300);
    },
  },
};
const fallInterval = () => Math.max(110, (800 - (level - 1) * 50) * (1 + 0.25 * pk('slowfall')) / (pk('overclock') ? 1.4 : 1));
const pInsulator   = () => Math.min(0.3, (BAL.insBase + BAL.insStep * (level - 1)) * (hasMod('rain') ? run.cfg.rainMul : 1) * (pk('clean') ? 0.5 : 1));
const pResistor    = () => 0.06 * (pk('ohm') ? 3 : 1);
const pBomb        = () => 0.03 * (pk('demo') ? 2.5 : 1);
const maxCharges   = () => BASE_CHARGES + pk('bank');

// Tile shapes: mask bits are UP=1 RIGHT=2 DOWN=4 LEFT=8. w = weight in the bag.
const SHAPES = [
  { name: 'straight', mask: 5,  w: 4 },
  { name: 'corner',   mask: 3,  w: 4 },
  { name: 'tee',      mask: 11, w: 3 },
  { name: 'cross',    mask: 15, w: 1 },
  { name: 'end',      mask: 1,  w: 2 },
];

// ---- Perks (effects are read through pk(id) in the code below) ------
const PERKS = [
  { id: 'crosses',   icon: '✚',        name: 'Більше хрестовин',   tier: 1, max: 3, desc: '+2 чотиристоронні хрестовини в мішку плиток.' },
  { id: 'rewire',    icon: '\u{1F527}',     name: 'Перепрокладка',          tier: 1,         desc: 'Тупиків більше немає: вони стають поворотами.' },

  { id: 'clean',     icon: '\u{1F9FC}',     name: 'Чиста кімната',      tier: 1,         desc: 'Ізолятори з’являються вдвічі рідше.' },

  { id: 'burn',      icon: '\u{1F9EF}',     name: 'Захист від стрибків', tier: 2,         desc: 'Перевантаження випалює 6 рядів замість 4.' },
  { id: 'arc',       icon: '\u{1F329}️', name: 'Дуговий розряд',     tier: 2,         desc: 'Коло випалює й ізолятори по діагоналі.' },
  { id: 'ohm',       icon: 'Ω',        name: 'Закон Ома',       tier: 2,         desc: 'Резистори з’являються втричі частіше й дають +40 до кола.' },

// ---- Constants derived from the above -------------------------------
const BW = COLS * T, BH = ROWS * T;
const HUD_H = 140, CTRL_H = 204;         // phone (portrait) layout: HUD above the board, touch controls below
const TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
let CW = WALL + BW + WALL + PANEL, CH = BH, portrait = false, boardY = 0;
// Prompts differ between touch and keyboard
const T_START  = TOUCH ? 'Торкніться екрана — почати' : 'Enter або клік — почати';
const T_NEW    = TOUCH ? 'Торкніться екрана — новий забіг' : 'Enter або клік — новий забіг';
const T_CONT   = TOUCH ? 'Торкніться, щоб продовжити' : 'Натисніть Enter або клацніть, щоб продовжити';
const T_RESUME = TOUCH ? 'Торкніться, щоб продовжити' : 'Натисніть P, щоб продовжити';

const T_HEAT   = TOUCH ? 'торкайтеся стрілок, щоб змінити нагрів' : '\u2190 \u2192 або 0\u20133 \u2014 змінити нагрів';
const kb = n => TOUCH ? '' : '[' + n + '] ';
const T_PICK = TOUCH ? 'Торкніться плитки, ще раз \u2014 обмін' : '\u2190 \u2192 \u2191 \u2193 вибір  \u2022  Enter \u2014 обмін  \u2022  Esc \u2014 скасувати';
const UP = 1, RIGHT = 2, DOWN = 4, LEFT = 8;
const DIRS = [
  { bit: UP,    dr: -1, dc: 0 },
  { bit: RIGHT, dr: 0,  dc: 1 },
  { bit: DOWN,  dr: 1,  dc: 0 },
  { bit: LEFT,  dr: 0,  dc: -1 },
];
const opp   = d => ((d << 2) | (d >> 2)) & 15;
const rotCW = m => ((m << 1) | (m >> 3)) & 15;
const rotCCW = m => ((m >> 1) | (m << 3)) & 15;
const bits  = m => (m & 1) + ((m >> 1) & 1) + ((m >> 2) & 1) + ((m >> 3) & 1);
const EMOJI = '"Segoe UI Emoji","Apple Color Emoji",system-ui,sans-serif';

const canvas = document.getElementById('c');
const g = canvas.getContext('2d');
const dpr = Math.min(2, window.devicePixelRatio || 1);
// Landscape desktops get the side-panel layout; phones, tablets and tall windows get the portrait layout.
let layoutW = -1, layoutH = -1;
function setLayout() {
  layoutW = innerWidth; layoutH = innerHeight;
  portrait = TOUCH || innerHeight > innerWidth * 1.05;
  CW = portrait ? WALL * 2 + BW : WALL + BW + WALL + PANEL;
  CH = portrait ? HUD_H + BH + CTRL_H : BH;
  boardY = portrait ? HUD_H : 0;
  canvas.width = CW * dpr; canvas.height = CH * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const k = Math.min(innerWidth / CW, innerHeight * (portrait ? 1 : 0.97) / CH, portrait ? 1.6 : 1.5);
  canvas.style.width = Math.floor(CW * k) + 'px';
  canvas.style.height = Math.floor(CH * k) + 'px';
}

// ---- Sound (tiny WebAudio beeps) ------------------------------------
let actx = null, muted = false;
function beep(f, d = 0.08, type = 'square', v = 0.035, slide = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime, o = actx.createOscillator(), a = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
    a.gain.setValueAtTime(v, t0);
    a.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(a).connect(actx.destination);
    o.start(t0); o.stop(t0 + d);
  } catch (e) { /* audio is optional */ }
}

// ---- Game state -----------------------------------------------------
let grid, cur, hold, canHold, queue, bag, score, level, circuits, chain, chainTiles = 0;
let state = 'ready';            // ready | play | clearing | settling | stagewin | shop | over | victory
let paused = false, showPerks = false;
let gravAcc = 0, lockAcc = 0, curX = 0, clearing = null;
let particles = [], texts = [], wallGlow = 0, volt = 0, best = 0;
let charge = 0, charges = 0, lastLock = null;   // charge meter (0-100), banked power-ups, undo target
let heat = 0;                   // chosen on the title / result screens (0..HEAT_MAX)
try { heat = Math.max(0, Math.min(HEAT_MAX, +localStorage.getItem('circuitDropHeat') || 0)); } catch (e) {}
let loadout = ['zap', 'swap', 'cross'], pickSel = [], pick = null;   // pick = {r, c} while the Swap power is choosing   // the 3 powers equipped for the run, and the screen's current pick
try { const l = JSON.parse(localStorage.getItem('circuitDropLoadout')); if (Array.isArray(l) && l.length === 3 && l.every(id => id in POWERS)) loadout = l; } catch (e) {}
let run = freshRun(), stageScore = 0, shop = null, summary = null, winT = 0, shopHits = [], menuHits = [];
let stageMaxChain = 0, chainWarned = false, driftAcc = 0, staticAcc = 0;
try { best = +localStorage.getItem('circuitDropBest') || 0; } catch (e) {}

function freshRun() {
  return { stage: 1, fuses: BAL.fuses, maxFuses: BAL.fuses, sparks: 0, perks: {}, netUsed: false, repairs: 0,
           heat, plan: {}, mods: [], deadRows: [], sinceRise: 0, machines: [], cfg: {}, frost: { col: -1, turns: 0 }, turnNo: 0,
           bosses: rollBosses(), loadout: loadout.slice(), freezeT: 0, skipTurn: false };
}
function pk(id) { return (run && run.perks[id]) || 0; }
const goalFor = s => Math.round(GOALS[s - 1] * (1 + HEAT_GOAL * run.heat) / 10) * 10;
const goal = () => goalFor(run.stage);
const sparkMul = () => 1 - HEAT_SPARKS * run.heat;
const chainNeed = () => 0;                      // chains are a scoring bonus now, not a requirement
const bossOf = stage => (run && run.bosses && run.bosses[stage]) || null;
const hasMod = id => run.mods.includes(id);
const isDead = r => run.deadRows.includes(r);
// Skill strength for a stage: tier defaults of every active skill, then the boss's own overrides.
function buildCfg(stage, mods) {
  const b = bossOf(stage), tier = b ? b.tier : 'medium', cfg = {};
  for (const id of mods) Object.assign(cfg, (SKILL_CFG[id] || {})[tier] || {});
  return Object.assign(cfg, b ? b.cfg : {});
}
function modLabel(id) {                          // counters shown next to the skill icon
  switch (id) {
    case 'rising':    return String(Math.max(0, riseEvery() - run.sinceRise));
    case 'machine':   return run.machines.map(machineLabel).join('\u00b7');
    case 'frost':     return run.frost.turns > 0 ? '\u2744' + run.frost.turns : String(run.cfg.frostEvery - (run.frostCount % run.cfg.frostEvery));
    case 'corrosion': return String(run.cfg.corrodeEvery - (run.corrodeCount % run.cfg.corrodeEvery));
    case 'scanner':   return String(run.cfg.scanEvery - (run.scanTurns % run.cfg.scanEvery));
    case 'timer':     return String(Math.max(0, run.turnsLeft));
    default:          return '';
  }
}
// Modifiers of a stage: the boss's own, plus `heat` extra ones from stage 5 on. Rolled once, then remembered.
function modsFor(stage) {
  if (run.plan[stage]) return run.plan[stage];
  const mods = (bossOf(stage) ? bossOf(stage).mods : []).slice();
  if (run.heat > 0 && stage >= HEAT_FROM_STAGE) {
    const pool = HEAT_POOL.filter(m => !mods.includes(m));
    for (let n = run.heat; n > 0 && pool.length; n--) mods.push(pool.splice((Math.random() * pool.length) | 0, 1)[0]);
  }
  return (run.plan[stage] = mods);
}
function setHeat(h) {
  heat = Math.max(0, Math.min(HEAT_MAX, h));
  try { localStorage.setItem('circuitDropHeat', heat); } catch (e) {}
  beep(400 + heat * 90, 0.06, 'square', 0.03);
}
const addScore = n => { score += n; stageScore += n; };

function emptyGrid() { return Array.from({ length: ROWS }, () => Array(COLS).fill(null)); }
function newTile(kind, mask) { return { kind, mask, hp: kind === 'res' ? 2 : 1, dy: 0, lit: false, cl: false, cr: false }; }

function refillBag() {
  bag = [];
  for (const s of SHAPES) {
    let w = s.w;
    if (s.name === 'cross') w += 2 * pk('crosses');
    if (pk('rewire')) { if (s.name === 'end') w = 0; if (s.name === 'corner') w += 2; }
    for (let i = 0; i < w; i++) bag.push(s);
  }
  for (let i = bag.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [bag[i], bag[j]] = [bag[j], bag[i]]; }
}
function drawNormal() {
  if (!bag || !bag.length) refillBag();
  let mask = bag.pop().mask;
  for (let i = (Math.random() * 4) | 0; i > 0; i--) mask = rotCW(mask);
  return newTile(Math.random() < pResistor() ? 'res' : 'normal', mask);
}
// Mercy: draw k candidate tiles and keep the one that fits the board best. k shrinks as the run goes on (BAL.mercy)
// and is 1 on Heat. Insulators and bombs are rolled first and never filtered.
function makeNext() {
  const r = Math.random(), pi = pInsulator();
  if (r < pi) return newTile('ins', 0);
  if (r < pi + pBomb()) return newTile('bomb', 0);
  const k = run.heat ? 1 : (BAL.mercy[run.stage - 1] || 1);
  let best = drawNormal(), bestFit = k > 1 ? tileFit(best) : 0;
  for (let i = 1; i < k; i++) {
    const t = drawNormal(), f = tileFit(t);
    if (f > bestFit) { best = t; bestFit = f; }
  }
  return best;
}

// ---- Run / stage flow -----------------------------------------------
function openLoadout() { pickSel = loadout.slice(); paused = false; state = 'loadout'; }
function togglePick(id) {
  const i = pickSel.indexOf(id);
  if (i >= 0) pickSel.splice(i, 1);
  else if (pickSel.length < 3) pickSel.push(id);
  else { beep(170, 0.1, 'sawtooth', 0.05); return; }
  beep(520, 0.05, 'square', 0.03);
}
function startWithLoadout() {
  if (pickSel.length !== 3) { beep(170, 0.1, 'sawtooth', 0.05); return; }
  loadout = pickSel.slice();
  try { localStorage.setItem('circuitDropLoadout', JSON.stringify(loadout)); } catch (e) {}
  newRun();
}
function newRun() {
  run = freshRun();
  score = 0; circuits = 0; hold = null; charge = 0; charges = 0; bag = []; queue = []; canHold = true;
  showPerks = false;
  startStage();
}
function startStage() {
  grid = emptyGrid(); chain = 0; chainTiles = 0; clearing = null; lastLock = null; shop = null; summary = null;
  particles = []; texts = []; paused = false; volt = 0;
  stageScore = 0; stageMaxChain = 0; chainWarned = false; driftAcc = 0; staticAcc = 0;
  run.netUsed = false; level = run.stage; run.sinceRise = 0;
  run.mods = modsFor(run.stage);
  run.cfg = buildCfg(run.stage, run.mods);
  run.freezeT = 0; run.skipTurn = false; pick = null;
  run.turnNo = 0; run.scanTurns = 0; run.corrodeCount = 0; run.frostCount = 0; run.frost = { col: -1, turns: 0 };
  run.turnsLeft = run.cfg.turnLimit || 0;
  run.machines = [];
  if (hasMod('machine')) for (let i = 0; i < (run.cfg.machines || 1); i++) run.machines.push(newMachine(i));
  run.deadRows = [];
  if (hasMod('deadrows') || hasMod('scanner')) {
    const rows = [];
    for (let r = DEAD_ROW_FROM; r < ROWS; r++) rows.push(r);
    while (run.deadRows.length < (run.cfg.deadRows || 3)) run.deadRows.push(rows.splice((Math.random() * rows.length) | 0, 1)[0]);
    run.deadRows.sort((a, b) => a - b);
  }
  while (queue.length < 3) queue.push(makeNext());
  if (run.mods.length) { state = 'briefing'; return; }   // read the rules, then Enter
  popText('ЕТАП ' + run.stage, WALL + BW / 2, BH / 2 - 30, '#ffe066', 28);
  popText('ціль ' + goal(), WALL + BW / 2, BH / 2 + 6, '#e8eefc', 18);
  spawn();
}
function beginStage() { spawn(); }
function riseEvery() { return (run.cfg && run.cfg.riseEvery) || BAL.riseEvery; }

// ---- Boss skills that act once per turn (a turn = a tile spawning) ---------
const rollRange = ([lo, hi]) => lo + ((Math.random() * (hi - lo + 1)) | 0);

// Laser machine: rides along above the board, stops, aims for 1-2 turns, fires at the top tile of its column
// (no score), recharges, rides again.
function newMachine(i) {
  const col = i ? (run.machines[0].col + 3) % COLS : (Math.random() * COLS) | 0;
  return { col, x: col, dir: Math.random() < 0.5 ? -1 : 1, mode: 'move', steps: i ? 1 : 0, need: rollRange(run.cfg.mSteps), aim: 0, cool: 0, beam: 0, beamY: 0 };
}
const machineLabel = m => m.mode === 'aim' ? '!' + m.aim : m.mode === 'cool' ? '\u23F3' + m.cool : String(Math.max(0, m.need - m.steps));
function machineTurn(m) {
  const c = run.cfg;
  if (m.mode === 'move') {
    let nc = m.col + m.dir;
    if (nc < 0 || nc >= COLS) { m.dir = -m.dir; nc = m.col + m.dir; }
    m.col = nc; m.steps++;
    if (m.steps >= m.need) { m.mode = 'aim'; m.aim = rollRange(c.mAim); beep(260, 0.12, 'square', 0.04); }
  } else if (m.mode === 'aim') {
    if (--m.aim <= 0) { machineFire(m); m.mode = 'cool'; m.cool = rollRange(c.mCool); }
  } else if (--m.cool <= 0) {                   // recharged: ride again
    m.mode = 'move'; m.steps = 0; m.need = rollRange(c.mSteps);
    if (Math.random() < 0.5) m.dir = -m.dir;
  }
}
function machineFire(m) {
  const r = topInCol(m.col);
  m.beam = 260; m.beamY = (r >= 0 ? r + 1 : ROWS) * T;
  if (r >= 0) {
    grid[r][m.col] = null;                      // destroyed without score
    burst(WALL + (m.col + 0.5) * T, (r + 0.5) * T, '#ff6a5a', 14);
    popText('ПРОМІНЬ', WALL + (m.col + 0.5) * T, r * T + 10, '#ff6a5a', 16);
    updateFlags(flood(true));
  }
  beep(520, 0.25, 'sawtooth', 0.05, -380);
}
// Scanner: the dead rows crawl down one row (wrapping), all together.
function scanShift() {
  const span = ROWS - DEAD_ROW_FROM;
  run.deadRows = run.deadRows.map(r => (r - DEAD_ROW_FROM + 1) % span + DEAD_ROW_FROM).sort((a, b) => a - b);
  popText('СКАНЕР', WALL + BW / 2, 16, '#ff9b8f', 14); beep(200, 0.12, 'square', 0.03);
}
// Frost: every few turns a random column (never the spawn column) freezes for a few turns; nothing can enter it.
function frostTurn() {
  const f = run.frost;
  if (f.turns > 0) { f.turns--; return; }
  if (++run.frostCount % run.cfg.frostEvery === 0) {
    let c; do { c = (Math.random() * COLS) | 0; } while (c === COLS >> 1);
    f.col = c; f.turns = rollRange(run.cfg.frostTurns);
    popText('МОРОЗ', WALL + (c + 0.5) * T, 44, '#8fd8ff', 18); beep(900, 0.2, 'sine', 0.04, -300);
  }
}
// Corrosion: a tile marked rusty last turn becomes an insulator now, and every few turns a new tile gets marked.
function corrodeTurn() {
  let changed = false;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = grid[r][c];
    if (t && t.rust) {
      const n = newTile('ins', 0); n.dy = r; grid[r][c] = n; changed = true;
      burst(WALL + (c + 0.5) * T, (r + 0.5) * T, '#c8763a', 8);
    }
  }
  if (++run.corrodeCount % run.cfg.corrodeEvery === 0) {
    const cands = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (grid[r][c] && grid[r][c].mask) cands.push([r, c]);
    if (cands.length) {
      const [r, c] = cands[(Math.random() * cands.length) | 0];
      grid[r][c].rust = true;
      popText('ІРЖА', WALL + (c + 0.5) * T, r * T + 10, '#ffb347', 14); beep(300, 0.1, 'triangle', 0.04);
    }
  }
  if (changed) { updateFlags(flood(true)); beep(180, 0.15, 'sawtooth', 0.04); }
}
// Short fuse: a turn limit. Running out costs a fuse and grants a few extra turns.
function timerTurn() {
  if (--run.turnsLeft >= 0) return;
  run.fuses--; run.turnsLeft = run.cfg.turnExtra || 8;
  popText('ЧАС ВИЙШОВ  \u22121', WALL + BW / 2, BH / 2 - 40, '#ff6a5a', 22); beep(160, 0.5, 'sawtooth', 0.06, -110);
  if (run.fuses <= 0) gameOver();
}

function spawn() {
  canHold = true;
  if (hasMod('rising') && run.sinceRise >= riseEvery()) { run.sinceRise = 0; risePush(); return; }
  const acting = run.turnNo++ > 0;               // boss skills act once per tile, but not on the very first one
  if (acting && run.skipTurn) { run.skipTurn = false; popText('БОС ПРОПУСТИВ ХІД', WALL + BW / 2, 30, '#8fd8ff', 16); }
  else if (acting) {
    for (const m of run.machines) machineTurn(m);
    if (hasMod('scanner') && ++run.scanTurns % run.cfg.scanEvery === 0) scanShift();
    if (hasMod('frost')) frostTurn();
    if (hasMod('corrosion')) corrodeTurn();
    if (hasMod('timer')) { timerTurn(); if (state === 'over') return; }
  }
  run.sinceRise++;
  startPiece(queue.shift());
  queue.push(makeNext());
}
// Rising insulators: push everything up one row and add an insulator row (with a few gaps) at the bottom.
function risePush() {
  if (grid[0].some(Boolean)) {                  // the stack would be pushed out of the top
    overload();
    if (state === 'over') return;
  }
  for (let r = 0; r < ROWS - 1; r++) for (let c = 0; c < COLS; c++) {
    const t = grid[r + 1][c];
    grid[r][c] = t;
    if (t) t.dy = r + 1;                        // animates upward
  }
  const gaps = new Set();
  while (gaps.size < (run.cfg.riseGaps || BAL.riseGaps)) gaps.add((Math.random() * COLS) | 0);
  for (let c = 0; c < COLS; c++) {
    const t = gaps.has(c) ? null : newTile('ins', 0);
    if (t) t.dy = ROWS;
    grid[ROWS - 1][c] = t;
  }
  applyGravity();
  popText('ПІДЙОМ ІЗОЛЯТОРІВ', WALL + BW / 2, BH / 2, '#ff9b5a', 20);
  beep(120, 0.35, 'sawtooth', 0.05, 60);
  state = 'settling';
}
function startPiece(t) {
  cur = { tile: t, col: COLS >> 1, row: 0, y: -1 };
  curX = cur.col; gravAcc = 0; lockAcc = 0; state = 'play';
  if (grid[0][cur.col]) overload();
}
// The stack reached the spawn point: burn the top rows and lose a fuse.
function overload() {
  const free = pk('net') && !run.netUsed;
  if (free) run.netUsed = true; else run.fuses--;
  const rows = OVERLOAD_ROWS + 2 * pk('burn');
  for (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++) {
    if (grid[r][c]) { grid[r][c] = null; burst(WALL + (c + 0.5) * T, (r + 0.5) * T, '#ff6a5a', 6); }
  }
  popText(free ? 'СІТКА СПРАЦЮВАЛА!' : 'ЗАПОБІЖНИК ЗГОРІВ  −1', WALL + BW / 2, BH / 2 - 40, free ? '#3de0d0' : '#ff6a5a', 22);
  beep(160, 0.5, 'sawtooth', 0.06, -110);
  updateFlags(flood(true));
  if (run.fuses <= 0) gameOver();
}
function saveBest() {
  if (score > best) { best = score; try { localStorage.setItem('circuitDropBest', best); } catch (e) {} }
}
function gameOver() {
  state = 'over'; cur = null; pick = null; saveBest();
  beep(220, 0.5, 'sawtooth', 0.05, -160);
}
function winStage() {
  state = 'stagewin'; winT = 0;
  const reward = Math.round((STAGE_BONUS + STAGE_BONUS_PER * run.stage) * sparkMul());
  const interest = pk('interest') ? Math.min(4, Math.floor(run.sparks / 5)) : 0;
  run.sparks += reward + interest;
  summary = { reward, interest };
  beep(660, 0.3, 'sine', 0.06, 440);
}
function updateStageWin(dt) {
  winT += dt;
  if (Math.random() < dt / 90) burst(WALL + Math.random() * BW, Math.random() * BH * 0.6, ['#ffe066', '#7dffb0', '#6db4ff', '#ff9bd0'][(Math.random() * 4) | 0], 10);
  if (winT > 1900) {
    if (run.stage === STAGES) { state = 'victory'; saveBest(); } else openShop();
  }
}

// ---- Shop -----------------------------------------------------------
function rollOffers() {
  const pool = PERKS.filter(p => pk(p.id) < (p.max || 1));
  const out = [];
  while (out.length < 3 && pool.length) {
    let tot = 0; for (const p of pool) tot += TIER_WEIGHT[p.tier];
    let r = Math.random() * tot, i = 0;
    for (; i < pool.length - 1; i++) { r -= TIER_WEIGHT[pool[i].tier]; if (r < 0) break; }
    const p = pool.splice(i, 1)[0];
    out.push({ perk: p, cost: TIER_COST[p.tier], sold: false });
  }
  return out;
}
function openShop() { state = 'shop'; shop = { offers: rollOffers(), rerolls: 0, msg: '' }; }
const repairCost = () => REPAIR_COST + REPAIR_STEP * run.repairs;
const rerollCost = () => REROLL_COST + shop.rerolls;
function shopMsg(m, ok) { shop.msg = m; shop.ok = ok; beep(ok ? 700 : 170, 0.12, ok ? 'sine' : 'sawtooth', 0.05); }
function buyOffer(i) {
  const o = shop.offers[i];
  if (!o || o.sold) return;
  if (run.sparks < o.cost) return shopMsg('Не вистачає іскор', false);
  run.sparks -= o.cost; o.sold = true;
  run.perks[o.perk.id] = pk(o.perk.id) + 1;
  if (o.perk.id === 'spare') { run.maxFuses++; run.fuses++; }
  bag = [];                                    // rebuild the bag so tile-pool perks apply at once
  shopMsg(o.perk.name + ' встановлено', true);
}
function buyRepair() {
  if (run.fuses >= run.maxFuses) return shopMsg('Запобіжники вже повні', false);
  if (run.sparks < repairCost()) return shopMsg('Не вистачає іскор', false);
  run.sparks -= repairCost(); run.repairs++; run.fuses++;
  shopMsg('Запобіжник відремонтовано', true);
}
function rerollShop() {
  if (run.sparks < rerollCost()) return shopMsg('Не вистачає іскор', false);
  run.sparks -= rerollCost(); shop.rerolls++;
  const fresh = rollOffers();
  shop.offers = shop.offers.map((o, i) => (o.sold || !fresh[i]) ? o : fresh[i]);
  shopMsg('Пропозиції оновлено', true);
}
function nextStage() { run.stage++; startStage(); }

// ---- Grid helpers ---------------------------------------------------
const inRange = (r, c) => r >= 0 && r < ROWS && c >= 0 && c < COLS;
const canMove = (r, c) => inRange(r, c) && !grid[r][c] && !(run.frost && run.frost.turns > 0 && run.frost.col === c);
const wallReach = () => 1 + pk('magnet');       // how many columns from a wall still touch it

// Flood-fill from the left (or right) wall along matching openings.
// Returns Map(cellKey -> distance from the wall).
function flood(fromLeft) {
  const dist = new Map(), q = [];
  const bit = fromLeft ? LEFT : RIGHT;
  for (let k = 0; k < wallReach(); k++) {
    const c0 = fromLeft ? k : COLS - 1 - k;
    for (let r = 0; r < ROWS; r++) {
      const t = grid[r][c0];
      if (t && (t.mask & bit) && !isDead(r)) { dist.set(r * COLS + c0, 0); q.push([r, c0]); }
    }
  }
  for (let i = 0; i < q.length; i++) {
    const [r, c] = q[i], t = grid[r][c], d = dist.get(r * COLS + c);
    for (const D of DIRS) {
      if (!(t.mask & D.bit)) continue;
      const nr = r + D.dr, nc = c + D.dc;
      if (!inRange(nr, nc)) continue;
      const n = grid[nr][nc];
      if (!n || !(n.mask & opp(D.bit))) continue;
      const k = nr * COLS + nc;
      if (dist.has(k)) continue;
      dist.set(k, d + 1); q.push([nr, nc]);
    }
  }
  return dist;
}
// A "piece" is a group of tiles linked to each other. A piece that touches both walls is a closed circuit,
// and every closed piece clears (branches included). Wires that touch only one wall stay where they are,
// which is what makes chains possible: they can drop into place after the first clear.
function linkedNeighbours(r, c) {
  const t = grid[r][c], out = [];
  for (const D of DIRS) {
    if (!(t.mask & D.bit)) continue;
    const nr = r + D.dr, nc = c + D.dc;
    if (!inRange(nr, nc)) continue;
    const n = grid[nr][nc];
    if (n && (n.mask & opp(D.bit))) out.push([nr, nc]);
  }
  return out;
}
function closedCells() {
  const reach = wallReach(), seen = new Set(), cells = [];
  for (let r0 = 0; r0 < ROWS; r0++) for (let c0 = 0; c0 < COLS; c0++) {
    if (!grid[r0][c0] || !grid[r0][c0].mask || seen.has(r0 * COLS + c0)) continue;
    const piece = [[r0, c0]]; seen.add(r0 * COLS + c0);
    for (let i = 0; i < piece.length; i++) {
      for (const [nr, nc] of linkedNeighbours(piece[i][0], piece[i][1])) {
        const k = nr * COLS + nc;
        if (!seen.has(k)) { seen.add(k); piece.push([nr, nc]); }
      }
    }
    const seeds = piece.filter(([r, c]) => !isDead(r) && c < reach && (grid[r][c].mask & LEFT));

// Minimum number of extra tiles needed to wire the + wall to the - wall: a Dijkstra over cells where existing,

function pathCost() {
  const INF = 99, N = ROWS * COLS, dist = new Float32Array(N).fill(INF), done = new Uint8Array(N);

    if (grid[r][c]) return 0;

      const nr = r + D.dr, nc = c + D.dc;
      if (!inRange(nr, nc)) continue;
      const n = grid[nr][nc];
      if (n && !(n.mask & opp(D.bit))) continue;
      const k = nr * COLS + nc, nd = bd + cost(nr, nc);
      if (nd < dist[k]) dist[k] = nd;

      else { const n = grid[nr][nc]; if (n) { if (n.mask & opp(D.bit)) links++; else bad++; } }
    } else if (inRange(nr, nc)) {
      const n = grid[nr][nc]; if (n && (n.mask & opp(D.bit))) blocked++;

// ---- Locking, resolving circuits, clearing --------------------------
function lockPiece() {
  const { tile, col, row } = cur;
  grid[row][col] = tile; tile.dy = row; cur = null;
  chain = 0; chainTiles = 0;
  beep(130, 0.07, 'triangle', 0.06, -40);
  if (tile.kind !== 'bomb') {
    lastLock = { row, col, tile };
    // every drop charges a little; every link to a neighbour or wall charges more
    let links = 0;
    for (const D of DIRS) {
      if (!(tile.mask & D.bit)) continue;
      const nr = row + D.dr, nc = col + D.dc;
      if (!inRange(nr, nc)) { if ((D.bit === LEFT || D.bit === RIGHT) && !isDead(row)) links++; continue; }
      const n = grid[nr][nc];
      if (n && (n.mask & opp(D.bit))) links++;
    }
    const gain = addCharge(CHARGE_BASE + links * CHARGE_PER_LINK);
    if (links > 0 && gain > 0) {
      popText('+' + Math.round(gain), WALL + (col + 0.5) * T, row * T + 6, '#3de0d0', 13);
      beep(500 + links * 120, 0.05, 'sine', 0.04);
    }
  }
  if (tile.kind === 'bomb') {
    const rad = 1 + pk('demo'), cells = [];
    for (let dr = -rad; dr <= rad; dr++) for (let dc = -rad; dc <= rad; dc++) {
      if (inRange(row + dr, col + dc) && grid[row + dr][col + dc]) cells.push({ r: row + dr, c: col + dc, d: 0, fired: false });
    }
    startClear(cells, 'bomb');

  }

}

function resolve() {
  const cells = closedCells();
  if (cells.length) { startClear(cells, 'circuit'); return; }
  updateFlags(flood(true));
  if (chain > 0 && chainTiles >= ALL_CLEAR_MIN && grid.every(row => row.every(t => !t))) {
    const bonus = ALL_CLEAR_BASE + ALL_CLEAR_PER * run.stage;
    addScore(bonus); popText('ПОЛЕ ЧИСТЕ  +' + bonus, WALL + BW / 2, BH / 2, '#7dffb0', 22);
    beep(880, 0.4, 'sine', 0.06, 440);
  }
  chain = 0;
  if (stageScore >= goal()) {
    if (stageMaxChain >= chainNeed()) { winStage(); return; }
    if (!chainWarned) {                         // score is there, but the boss wants a chain too
      chainWarned = true;
      popText('Потрібен ланцюжок ×' + chainNeed() + '!', WALL + BW / 2, BH / 2, '#ff9bd0', 20);
    }

}

// ---- Charge meter & power-ups ----------------------------------------
function addCharge(n) {

  if (volt > 0.55) n *= CHARGE_MERCY;           // struggling players charge faster
  n *= 1 + 0.5 * pk('qcharge');
  charge += n;
  while (charge >= 100 && charges < cap) {
    charge -= 100; charges++;
    popText('ЗАРЯД ГОТОВИЙ', WALL + BW / 2, BH / 2 - 60, '#3de0d0', 20);
    beep(660, 0.25, 'sine', 0.06, 440);
  }

    const r = topInCol(c); if (r < 0) continue;
    const d = Math.abs(c - cur.col);

      for (let y = 0; y < ROWS; y++) if (grid[y][nc] && (bestR < 0 || Math.abs(y - r) < Math.abs(bestR - r))) bestR = y;
      if (bestR >= 0) { pick = { r: bestR, c: nc }; beep(300, 0.03, 'square', 0.02); return; }

      if (r !== w) { grid[w][c] = grid[r][c]; grid[r][c] = null; }   // dy keeps old row -> animates down
      w--;

  }

// Animate tiles toward their grid row. Returns true while anything is still moving.
function animTiles(dt) {
  let moving = false;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = grid[r][c];
    if (t && t.dy < r) { t.dy = Math.min(r, t.dy + SETTLE_SPEED * dt); moving = true; }
    else if (t && t.dy > r) { t.dy = Math.max(r, t.dy - SETTLE_SPEED * dt); moving = true; }   // rising rows

// ---- Effects --------------------------------------------------------
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = 0.05 + Math.random() * 0.2;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.05, life: 350 + Math.random() * 350, max: 700, color });
  }
}
function popText(text, x, y, color, size) { texts.push({ text, x, y, color, size, life: 1100 }); }
function updateFx(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.0005 * dt; p.life -= dt; }

  for (const t of texts) { t.y -= 0.03 * dt; t.life -= dt; }

// ---- Update loop ----------------------------------------------------
const keys = new Set();
function updatePlay(dt) {
  if (!cur) return;
  if (pick || run.freezeT > 0) {                // Freeze power or Exchange choosing: nothing falls, drifts or turns
    if (!pick) run.freezeT -= dt;
    cur.y += (cur.row - cur.y) * Math.min(1, dt * 0.03);
    curX += (cur.col - curX) * Math.min(1, dt * 0.04);
    return;
  }
  if (hasMod('drift')) {                        // Drift: the falling tile gets nudged sideways now and then
    driftAcc += dt;
    if (driftAcc >= (run.cfg.driftMs || 2400)) {
      driftAcc = 0;
      const d = Math.random() < 0.5 ? -1 : 1;
      if (canMove(cur.row, cur.col + d)) cur.col += d;
    }
  }
  if (hasMod('static')) {                       // Static: the falling tile turns by itself
    staticAcc += dt;
    if (staticAcc >= (run.cfg.staticMs || 3000)) {
      staticAcc = 0; cur.tile.mask = rotCW(cur.tile.mask);
      burst(WALL + (cur.col + 0.5) * T, (cur.row + 0.5) * T, '#9fb0ff', 8); beep(700, 0.05, 'square', 0.03);
    }

function update(dt) {
  const moving = animTiles(dt);

  if (pick) {                                   // while choosing a tile the buttons steer the cursor
    switch (id) {
      case 'left': pickMove(-1, 0); break;
      case 'right': pickMove(1, 0); break;
      case 'rot': pickMove(0, -1); break;
      case 'soft': pickMove(0, 1); break;
      case 'drop': pickConfirm(); break;
      case 'hold': pickCancel(); break;
    }
    return;
  }
  switch (id) {
    case 'left': actMove(-1); break;
    case 'right': actMove(1); break;
    case 'rot': actRotate(true); break;
    case 'drop': actDrop(); break;
    case 'hold': actHold(); break;
    case 'p0': usePower(0); break;
    case 'p1': usePower(1); break;
    case 'p2': usePower(2); break;
    case 'pause': paused = !paused; showPerks = false; break;
    case 'perks': showPerks = !showPerks; paused = showPerks; break;
    case 'mute': muted = !muted; break;
  }
}
canvas.addEventListener('pointerdown', e => {
  if (actx && actx.state === 'suspended') actx.resume();
  if (!portrait) return;
  const { x, y } = canvasPos(e);
  if (paused) { paused = false; showPerks = false; return; }          // tap anywhere resumes
  for (const h of uiHits) {
    if (x < h.x || x > h.x + h.w || y < h.y || y > h.y + h.h) continue;
    stopPress(); press.id = e.pointerId; press.hit = h.id;
    if (h.id === 'soft' && !pick) keys.add('ArrowDown');
    else {
      runButton(h.id);
      if (h.id === 'left' || h.id === 'right') press.timer = setTimeout(() => { press.iv = setInterval(() => runButton(h.id), 80); }, 220);
    }
    return;
  }
  if (pick && state === 'play' && y >= boardY && y < boardY + BH) { pickTap(x, y - boardY); return; }
  if (state === 'play' && y >= boardY && y < boardY + BH) {
    stopPress(); press.id = e.pointerId; press.hit = 'board';
    press.sx = press.ax = x; press.sy = y; press.st = performance.now(); press.moved = false;
  }
});
addEventListener('pointermove', e => {
  if (press.id !== e.pointerId || press.hit !== 'board') return;
  const { x } = canvasPos(e), step = T * 0.85;
  while (Math.abs(x - press.ax) >= step) {
    const d = Math.sign(x - press.ax);
    actMove(d); press.ax += d * step; press.moved = true;
  }
});
function endPress(e) {
  if (press.id !== e.pointerId) return;
  if (press.hit === 'board' && e.type === 'pointerup') {
    const { x, y } = canvasPos(e), dt = performance.now() - press.st, dx = x - press.sx, dy = y - press.sy;
    if (!press.moved && Math.hypot(dx, dy) < 14 && dt < 350) actRotate(true);        // tap
    else if (dy > 90 && Math.abs(dx) < 70 && dt < 500) actDrop();                    // swipe down
  }
  stopPress();
}
addEventListener('pointerup', endPress);
addEventListener('pointercancel', endPress);

// ---- Rendering ------------------------------------------------------
function rr(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);         g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function wrap(text, maxW) {
  const lines = []; let line = '';
  for (const w of text.split(' ')) {
    const t = line ? line + ' ' + w : w;
    if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

function drawTile(x, y, t, s, alpha = 1) {
  g.save();
  g.translate(x, y); g.globalAlpha = alpha;
  const p = s * 0.04, cx = s / 2, cy = s / 2, lw = s * 0.2;

  if (t.kind === 'ins') {                       // insulator: hatched dead block
    rr(p, p, s - 2 * p, s - 2 * p, s * 0.12);
    g.fillStyle = '#30353f'; g.fill();
    g.save(); g.clip();
    g.strokeStyle = '#464d5a'; g.lineWidth = 3;
    for (let i = -s; i < 2 * s; i += 10) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + s, s); g.stroke(); }
    g.restore();
    rr(p, p, s - 2 * p, s - 2 * p, s * 0.12);
    g.strokeStyle = '#59616f'; g.lineWidth = 1.5; g.stroke();
    g.restore(); return;
  }

  rr(p, p, s - 2 * p, s - 2 * p, s * 0.12);
  g.fillStyle = t.lit ? '#3b3516' : '#151d2b'; g.fill();
  g.lineWidth = 1.5; g.strokeStyle = t.lit ? '#ffe066' : '#27344a'; g.stroke();

  if (t.kind === 'bomb') {
    g.font = `${s * 0.6}px ${EMOJI}`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('\u{1F4A3}', cx, cy + s * 0.03);
    g.restore(); return;
  }

  const col = t.lit ? '#fff3a0' : (t.cl && t.cr) ? '#d6a8ff' : t.cl ? '#ff8f7d' : t.cr ? '#72b8ff' : '#8b99b3';
  const core = t.lit ? '#fffbd0' : '#0e1522';
  if (t.lit) { g.shadowColor = '#ffd84a'; g.shadowBlur = 16; }
  g.lineCap = 'butt';
  g.strokeStyle = col; g.fillStyle = col; g.lineWidth = lw;
  for (const D of DIRS) if (t.mask & D.bit) {
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + D.dc * s / 2, cy + D.dr * s / 2); g.stroke();
  }
  g.beginPath(); g.arc(cx, cy, lw * 0.62, 0, 7); g.fill();
  g.shadowBlur = 0;
  g.strokeStyle = core; g.fillStyle = core; g.lineWidth = lw * 0.4;
  for (const D of DIRS) if (t.mask & D.bit) {
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + D.dc * s / 2, cy + D.dr * s / 2); g.stroke();
  }
  g.beginPath(); g.arc(cx, cy, lw * 0.3, 0, 7); g.fill();

  if (t.kind === 'res') {                       // resistor: needs two pulses
    g.fillStyle = '#ffb347';
    rr(cx - lw * 0.95, cy - lw * 0.95, lw * 1.9, lw * 1.9, 4); g.fill();
    g.fillStyle = '#2a1a05'; g.font = `bold ${s * 0.28}px system-ui`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('Ω', cx, cy + 1);
  }
  if (t.rust) {                                 // corrosion warning
    rr(p, p, s - 2 * p, s - 2 * p, s * 0.12); g.fillStyle = 'rgba(255,140,40,0.35)'; g.fill();
    g.lineWidth = 2; g.strokeStyle = '#ffb347'; g.stroke();
    g.fillStyle = '#ffb347'; g.font = `800 ${s * 0.4}px system-ui`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('!', s - s * 0.2, s * 0.22);
  }
  g.restore();
}

function drawWall(x0, left) {
  const c = left ? '#ff5d4d' : '#4da3ff';
  const gr = g.createLinearGradient(x0, 0, x0 + WALL, 0);
  gr.addColorStop(left ? 0 : 1, left ? '#2a1114' : '#0f1d33');
  gr.addColorStop(left ? 1 : 0, '#0b0f17');
  g.fillStyle = gr; g.fillRect(x0, 0, WALL, BH);

  g.save();                                     // coil
  g.strokeStyle = c; g.lineWidth = 3.5; g.lineJoin = 'round';
  g.shadowColor = c; g.shadowBlur = 6 + wallGlow * 26; g.globalAlpha = 0.7 + 0.3 * wallGlow;
  g.beginPath();
  const a = x0 + 10, b = x0 + WALL - 14;
  let i = 0;
  for (let y = 48; y <= BH - 48; y += 20, i++) { const x = i % 2 ? a : b; if (i === 0) g.moveTo(x, y); else g.lineTo(x, y); }
  g.stroke();
  g.restore();

  const rx = left ? x0 + WALL - 2 : x0 + 2;     // rail facing the board
  g.fillStyle = c; g.globalAlpha = 0.85; g.fillRect(rx - 1.5, 0, 3, BH); g.globalAlpha = 1;
  for (const r of run.deadRows) {               // dead rows: the wall is insulated here
    g.save();
    g.beginPath(); g.rect(x0, r * T, WALL, T); g.clip();
    g.fillStyle = '#0b0f17'; g.fillRect(x0, r * T, WALL, T);
    g.strokeStyle = '#5a6270'; g.lineWidth = 3;
    for (let i = -T; i < WALL + T; i += 10) { g.beginPath(); g.moveTo(x0 + i, r * T); g.lineTo(x0 + i + T, r * T + T); g.stroke(); }
    g.restore();
  }
  g.font = 'bold 32px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(left ? '+' : '−', x0 + WALL / 2, 24);
  g.fillText(left ? '+' : '−', x0 + WALL / 2, BH - 24);

  const c0 = left ? 0 : COLS - 1, bit = left ? LEFT : RIGHT;   // contact nodes
  for (let r = 0; r < ROWS; r++) {
    const t = grid[r][c0];
    if (!t || !(t.mask & bit) || isDead(r)) continue;
    const on = left ? t.cl : t.cr;
    g.beginPath(); g.arc(rx, (r + 0.5) * T, on ? 7 : 5, 0, 7);
    g.fillStyle = on ? '#ffffff' : c; g.shadowColor = c; g.shadowBlur = on ? 14 : 0; g.fill(); g.shadowBlur = 0;
  }
}

// Exchange power: blinking cursor on the chosen tile, a small preview of what will take its place, and a hint bar.
function drawPick(now) {
  const x = WALL + pick.c * T, y = pick.r * T, t = grid[pick.r][pick.c];
  g.save();
  g.fillStyle = 'rgba(8,11,18,0.4)'; g.fillRect(WALL, 0, BW, BH);                // dim the board
  if (t) drawTile(x, y, t, T);                                                   // the chosen tile stays bright
  g.globalAlpha = 0.55 + 0.45 * Math.sin(now / 110);
  g.strokeStyle = '#ffe066'; g.lineWidth = 3; rr(x + 1, y + 1, T - 2, T - 2, 7); g.stroke();
  g.globalAlpha = 1;
  const px = Math.min(WALL + BW - 30, x + T - 14), py = Math.max(2, y - 12);       // preview: the falling tile that will go here
  rr(px - 2, py - 2, 30, 30, 6); g.fillStyle = '#0d1320'; g.fill(); g.strokeStyle = '#ffe066'; g.lineWidth = 1.5; g.stroke();
  drawTile(px, py, cur.tile, 26);
  g.font = '12px system-ui'; const tw = g.measureText(T_PICK).width + 18;
  rr(WALL + BW / 2 - tw / 2, BH - 30, tw, 22, 8); g.fillStyle = 'rgba(8,11,18,0.9)'; g.fill();
  g.fillStyle = '#ffe066'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(T_PICK, WALL + BW / 2, BH - 19);
  g.restore();
}

function machineSprite(cx, y, aimNum, st) {
  const aiming = st === 'aim', cooling = st === 'cool';
  g.save(); g.translate(cx, y);
  rr(-17, 0, 34, 16, 5); g.fillStyle = '#3b4558'; g.fill();
  g.lineWidth = 1.5; g.strokeStyle = aiming ? '#ff5a4a' : cooling ? '#3a4558' : '#6f7d96'; g.stroke();
  g.fillStyle = aiming ? '#ff5a4a' : cooling ? '#56637a' : '#7fd6ff'; g.beginPath(); g.arc(0, 8, 4, 0, 7); g.fill();     // lens
  g.fillStyle = '#6f7d96'; g.fillRect(-14, 16, 5, 3); g.fillRect(9, 16, 5, 3);                    // feet
  if (aiming) { g.fillStyle = '#fff'; g.font = '700 10px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(aimNum), 0, 8.5); }
  g.restore();
}
function drawMachine(m, now) {
  const aim = m.mode === 'aim', tr = topInCol(m.col);
  const bx = WALL + (m.col + 0.5) * T;
  if (aim || m.beam > 0) {
    g.save();
    if (m.beam > 0) {                           // the shot
      g.globalAlpha = Math.min(1, m.beam / 200); g.strokeStyle = '#ffe5e0'; g.lineWidth = 8;
      g.shadowColor = '#ff3b30'; g.shadowBlur = 18;
      g.beginPath(); g.moveTo(bx, 18); g.lineTo(bx, m.beamY); g.stroke();
    } else {                                    // warning: dashed line to the tile that will be hit
      const ty = (tr >= 0 ? tr : ROWS) * T;
      g.globalAlpha = 0.35 + 0.25 * Math.sin(now / 90); g.strokeStyle = '#ff5a4a'; g.lineWidth = 2;
      g.setLineDash([6, 6]); g.beginPath(); g.moveTo(bx, 18); g.lineTo(bx, ty); g.stroke(); g.setLineDash([]);
      if (tr >= 0) {                            // the doomed tile: red tint, X and the turns left
        const tx = WALL + m.col * T, tyy = tr * T;
        g.globalAlpha = 0.28; g.fillStyle = '#ff3b30'; rr(tx + 2, tyy + 2, T - 4, T - 4, 6); g.fill();
        g.globalAlpha = 0.95; g.lineWidth = 2.5; rr(tx + 2, tyy + 2, T - 4, T - 4, 6); g.stroke();
        g.lineWidth = 3; g.beginPath(); g.moveTo(tx + 14, tyy + 14); g.lineTo(tx + T - 14, tyy + T - 14); g.moveTo(tx + T - 14, tyy + 14); g.lineTo(tx + 14, tyy + T - 14); g.stroke();
        g.globalAlpha = 1; g.fillStyle = '#ff3b30'; g.beginPath(); g.arc(tx + T - 9, tyy + 9, 8, 0, 7); g.fill();
        g.fillStyle = '#fff'; g.font = '700 11px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(m.aim), tx + T - 9, tyy + 9.5);
      }
    }
    g.restore();
  }
  machineSprite(WALL + (m.x + 0.5) * T, 3, m.aim, m.mode);
}

function drawBoard(now) {
  g.fillStyle = '#0f1623'; g.fillRect(WALL, 0, BW, BH);
  g.strokeStyle = 'rgba(255,255,255,0.045)'; g.lineWidth = 1; g.beginPath();
  for (let c = 1; c < COLS; c++) { g.moveTo(WALL + c * T + 0.5, 0); g.lineTo(WALL + c * T + 0.5, BH); }
  for (let r = 1; r < ROWS; r++) { g.moveTo(WALL, r * T + 0.5); g.lineTo(WALL + BW, r * T + 0.5); }
  g.stroke();

  for (const r of run.deadRows) {               // dead rows are tinted across the whole board
    g.fillStyle = 'rgba(255,70,70,0.07)'; g.fillRect(WALL, r * T, BW, T);
  }
  if (volt > 0.65) {                            // overload warning
    g.fillStyle = `rgba(255,50,50,${0.05 + 0.06 * Math.sin(now / 120)})`;
    g.fillRect(WALL, 0, BW, T * 2);
  }

  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = grid[r][c];
    if (t) drawTile(WALL + c * T, t.dy * T, t, T);
  }

  const fr = run.frost;                         // frozen column
  if (fr && fr.turns > 0) {
    const fx = WALL + fr.col * T;
    g.fillStyle = 'rgba(120,200,255,0.18)'; g.fillRect(fx, 0, T, BH);
    g.strokeStyle = 'rgba(160,220,255,0.75)'; g.lineWidth = 2; g.strokeRect(fx + 1, 1, T - 2, BH - 2);
    g.fillStyle = '#bfe8ff'; g.font = `700 16px ${EMOJI}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('\u2744\uFE0F' + fr.turns, fx + T / 2, 34);
  }
  const fog = hasMod('fog'), fogH = (run.cfg.fogRows || 4) * T;
  if (cur && state === 'play') {
    const foggy = fog && cur.y * T < fogH - T * 0.5;
    let gr = cur.row;
    while (canMove(gr + 1, cur.col)) gr++;
    if (gr > cur.row && !fog) {                 // landing hint (fog hides it)
      g.save(); g.setLineDash([4, 4]); g.strokeStyle = 'rgba(255,255,255,0.28)'; g.lineWidth = 1.5;
      rr(WALL + cur.col * T + 3, gr * T + 3, T - 6, T - 6, 6); g.stroke(); g.restore();
      drawTile(WALL + cur.col * T, gr * T, cur.tile, T, 0.2);
    }
    if (foggy) {                                // the falling tile is hidden until it leaves the fog
      const fx = WALL + curX * T, fy = cur.y * T;
      rr(fx + 3, fy + 3, T - 6, T - 6, 8); g.fillStyle = '#1a2233'; g.fill();
      g.strokeStyle = '#3a4a66'; g.lineWidth = 1.5; g.stroke();
      g.fillStyle = '#56637a'; g.font = '700 20px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', fx + T / 2, fy + T / 2 + 1);
    } else drawTile(WALL + curX * T, cur.y * T, cur.tile, T);
  }
  if (fog) {                                    // haze over the fog rows
    const gg = g.createLinearGradient(0, 0, 0, fogH);
    gg.addColorStop(0, 'rgba(170,190,215,0.18)'); gg.addColorStop(1, 'rgba(170,190,215,0)');
    g.fillStyle = gg; g.fillRect(WALL, 0, BW, fogH);
  }
  if (run.freezeT > 0) {                        // frozen time
    g.fillStyle = 'rgba(120,200,255,0.07)'; g.fillRect(WALL, 0, BW, BH);
    g.fillStyle = '#bfe8ff'; g.font = `700 16px ${EMOJI}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('\u{1F9CA} ' + (run.freezeT / 1000).toFixed(1), WALL + BW / 2, BH - 18);
  }

  for (const m of run.machines) drawMachine(m, now);
  if (pick) drawPick(now);
  for (const p of particles) {
    g.globalAlpha = Math.max(0, p.life / p.max); g.fillStyle = p.color;
    g.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  g.globalAlpha = 1;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const t of texts) {
    g.globalAlpha = Math.min(1, t.life / 400);
    g.font = `bold ${t.size}px ${EMOJI}`;
    g.lineWidth = 4; g.strokeStyle = '#000'; g.strokeText(t.text, t.x, t.y);
    g.fillStyle = t.color; g.fillText(t.text, t.x, t.y);
  }
  g.globalAlpha = 1;
}

// ---- Side panel ------------------------------------------------------
const PX = WALL + BW + WALL + 16, PW = PANEL - 28;
function lab(txt, x, y) { g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.fillStyle = '#6f7d96'; g.font = '700 10px system-ui'; g.fillText(txt, x, y); }
function drawFuses(x, y) {
  for (let i = 0; i < run.maxFuses; i++) {
    rr(x + i * 12, y, 10, 16, 2);
    g.fillStyle = i < run.fuses ? '#ffb347' : '#2a2f3a'; g.fill();
  }
}
function drawHeader() {
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = '#ffe066'; g.font = '800 20px system-ui'; g.fillText('CIRCUIT DROP', PX, 28);
  if (run.heat) { g.textAlign = 'right'; g.fillStyle = '#ff8a3d'; g.font = `700 12px ${EMOJI}`; g.fillText('\u{1F525} ' + run.heat, PX + PW, 28); g.textAlign = 'left'; }
  lab('РАХУНОК', PX, 54);
  g.fillStyle = '#e8eefc'; g.font = '700 24px system-ui'; g.fillText(String(score), PX, 80);
  g.textAlign = 'right'; g.fillStyle = '#6f7d96'; g.font = '11px system-ui'; g.fillText('рекорд ' + best, PX + PW, 80); g.textAlign = 'left';
}
function drawOwned(y0) {
  lab('ВАШІ ПЕРКИ', PX, y0);
  const own = PERKS.filter(p => pk(p.id) > 0);
  g.font = `12px ${EMOJI}`; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  if (!own.length) { g.fillStyle = '#56637a'; g.fillText('поки немає', PX, y0 + 20); }
  own.forEach((p, i) => {
    g.fillStyle = '#cfd8ea';
    g.fillText(p.icon + ' ' + p.name + (pk(p.id) > 1 ? ' x' + pk(p.id) : ''), PX, y0 + 20 + i * 18);
  });
}

function drawPanel(now) {
  const x = PX, w = PW;
  drawHeader();

  lab('ЕТАП', x, 108); lab('ІСКРИ', x + 52, 108); lab('ЗАПОБІЖНИКИ', x + 112, 108);
  g.fillStyle = '#e8eefc'; g.font = '700 18px system-ui'; g.fillText(run.stage + '/' + STAGES, x, 132);
  g.fillStyle = '#7fd6ff'; g.fillText('◆ ' + run.sparks, x + 52, 132);
  drawFuses(x + 112, 118);

  lab('ЦІЛЬ', x, 156);
  g.textAlign = 'right'; g.fillStyle = '#cfd8ea'; g.font = '700 11px system-ui';
  g.fillText(stageScore + ' / ' + goal(), x + w, 156); g.textAlign = 'left';
  g.fillStyle = '#18202e'; rr(x, 162, w, 12, 4); g.fill();
  const gp = Math.min(1, stageScore / goal());
  if (gp > 0.01) { g.fillStyle = gp >= 1 ? '#7dffb0' : '#ffe066'; rr(x, 162, Math.max(8, w * gp), 12, 4); g.fill(); }

  // active boss skills with their counters
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let mx = x;
  for (const id of run.mods) {
    if (mx > x + w - 24) break;
    g.font = `13px ${EMOJI}`; g.fillStyle = '#ffb347'; g.fillText(MODS[id].icon, mx, 194); mx += 20;
    const lb = modLabel(id);
    if (lb) {
      g.font = '700 11px system-ui'; g.fillStyle = (id === 'machine' && run.machines.some(m => m.mode === 'aim')) ? '#ff5a4a' : '#ffb347';
      g.fillText(lb, mx, 194); mx += g.measureText(lb).width + 8;
    }
  }

  lab('ДАЛІ', x, 216);
  for (let i = 0; i < queue.length; i++) {
    const s = i === 0 ? 44 : 38, tx = x + (i === 0 ? 0 : 6), ty = 224 + i * 46 + (i ? 6 : 0);
    if (hasMod('fog')) {                      // Blackout: the preview is hidden
      rr(tx + 2, ty + 2, s - 4, s - 4, 6); g.fillStyle = '#10151f'; g.fill();
      g.strokeStyle = '#27344a'; g.lineWidth = 1.5; g.stroke();
      g.fillStyle = '#56637a'; g.font = '700 18px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('?', tx + s / 2, ty + s / 2 + 1); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    } else drawTile(tx, ty, queue[i], s, i === 0 ? 1 : 0.7);
  }

  lab('ЗАПАС', x, 380);
  rr(x, 388, 52, 52, 6); g.strokeStyle = canHold ? '#2e3d57' : '#5a2a2a'; g.lineWidth = 1.5; g.stroke();
  if (hold) drawTile(x, 388, hold, 52, canHold ? 1 : 0.4);

  lab('НАПРУГА', x, 458);
  g.fillStyle = '#18202e'; rr(x, 466, w, 16, 4); g.fill();

// Draw text shrunk (down to 8px) until it fits maxW.
function fitText(txt, x, y, maxW, size, weight = '') {

}

// Mini picture of a chain. Red = circuit A, blue = circuit B (rows 9..11 of a 7-column board).
// 1: A is one tile short. 2: that tile lands, A closes. 3: A is gone, B has dropped and closed too.
function drawChainDiagram(x, y, w) {
  const s = 14, gap = 12, fw = 7 * s, x0 = x + (w - (3 * fw + 2 * gap)) / 2;
  const mk = (mask, own, lit) => ({ kind: 'normal', mask, hp: 1, dy: 0, lit, cl: own === 'A', cr: own === 'B' });
  const H = 10;                                   // horizontal straight
  const frame = n => {
    const f = [Array(7).fill(null), Array(7).fill(null), Array(7).fill(null)];
    const lit = n === 2;
    if (n < 3) {
      f[0][2] = mk(H, 'B');
      f[1][0] = mk(H, 'B'); f[1][1] = mk(H, 'B');
      f[1][2] = mk(6, 'A', lit); f[1][3] = mk(H, 'A', lit); f[1][4] = mk(H, 'A', lit); f[1][6] = mk(H, 'A', lit);
      if (n === 2) f[1][5] = mk(H, 'A', true);
      f[2][0] = mk(H, 'A', lit); f[2][1] = mk(H, 'A', lit); f[2][2] = mk(9, 'A', lit);
      for (let c = 3; c < 7; c++) f[2][c] = mk(H, 'B');
    } else {
      for (let c = 0; c < 7; c++) f[2][c] = mk(H, 'B', true);
    }
    return f;
  };
  const captions = ['1. Остання плитка', '2. Коло A зникає', '3. B падає: ×2'];
  for (let n = 1; n <= 3; n++) {
    const fx = x0 + (n - 1) * (fw + gap), f = frame(n);
    rr(fx - 1, y - 1, fw + 2, 3 * s + 2, 3); g.fillStyle = '#0f1623'; g.fill();
    for (let r = 0; r < 3; r++) for (let c = 0; c < 7; c++) if (f[r][c]) drawTile(fx + c * s, y + r * s, f[r][c], s);
    if (n === 1) {                                // the missing tile
      g.save(); g.setLineDash([2, 2]); g.strokeStyle = '#ffe066'; g.lineWidth = 1;
      g.strokeRect(fx + 5 * s + 1.5, y + s + 1.5, s - 3, s - 3); g.restore();
      g.fillStyle = '#ffe066'; g.font = '700 9px system-ui'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
      g.fillText('\u25BC', fx + 5.5 * s, y - 3);
    }
    if (n < 3) { g.fillStyle = '#56637a'; g.font = '700 12px system-ui'; g.textAlign = 'center'; g.fillText('\u25B6', fx + fw + gap / 2, y + 1.5 * s + 4); }
    g.fillStyle = n === 3 ? '#7dffb0' : '#9fb0cc'; g.font = '700 9.5px system-ui'; g.textAlign = 'center';
    g.fillText(captions[n - 1], fx + fw / 2, y + 3 * s + 13);
  }
}

// Mini picture of the laser machine: 1 = it rides along, 2 = it stops and aims (counter shows the turns left), 3 = the shot.
function drawMachineDiagram(x, y, w) {
  const s = 14, gap = 14, cols = 5, fw = cols * s, x0 = x + (w - (3 * fw + 2 * gap)) / 2, top = y + 9;
  const tile = (mask, hot) => ({ kind: 'normal', mask, hp: 1, dy: 0, lit: false, cl: !!hot, cr: false });
  const captions = ['1. Їде', '2. Ціль, 2 ходи', '3. Постріл!'];
  for (let n = 1; n <= 3; n++) {
    const fx = x0 + (n - 1) * (fw + gap), mcol = n === 1 ? 1 : 3;
    rr(fx - 1, top - 1, fw + 2, 3 * s + 2, 3); g.fillStyle = '#0f1623'; g.fill();
    for (let c = 0; c < cols; c++) drawTile(fx + c * s, top + 2 * s, tile(10), s);          // floor row
    drawTile(fx + 1 * s, top + s, tile(5), s); drawTile(fx + 3 * s, top + s, tile(5), s);   // two small stacks
    if (n === 3) {                                  // the top tile of column 3 is gone
      g.fillStyle = '#0f1623'; g.fillRect(fx + 3 * s, top + s, s, s);
      g.fillStyle = '#ff6a5a'; for (let i = 0; i < 4; i++) g.fillRect(fx + 3 * s + 2 + (i * 3) % 10, top + s + 3 + (i * 5) % 9, 2, 2);
    }
    const bx = fx + (mcol + 0.5) * s;
    if (n === 2) {
      g.save(); g.strokeStyle = '#ff5a4a'; g.lineWidth = 1; g.setLineDash([2, 2]);
      g.beginPath(); g.moveTo(bx, top - 1); g.lineTo(bx, top + s); g.stroke(); g.restore();
      g.strokeStyle = '#ff5a4a'; g.lineWidth = 1.5; g.strokeRect(fx + 3 * s + 1, top + s + 1, s - 2, s - 2);
    }
    if (n === 3) { g.save(); g.strokeStyle = '#ffe5e0'; g.lineWidth = 3; g.shadowColor = '#ff3b30'; g.shadowBlur = 6; g.beginPath(); g.moveTo(bx, top - 1); g.lineTo(bx, top + 2 * s); g.stroke(); g.restore(); }
    const mx = fx + (mcol + 0.5) * s;              // the machine, shrunk
    g.save(); g.translate(mx, y - 1); g.scale(0.4, 0.4); machineSprite(0, 0, n === 2 ? 2 : 0, n === 2 ? 'aim' : n === 3 ? 'cool' : 'move'); g.restore();
    if (n === 1) { g.fillStyle = '#56637a'; g.font = '700 8px system-ui'; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillText('\u25B6', mx + 11, y + 4); }
    g.fillStyle = n === 3 ? '#ff9b8f' : '#9fb0cc'; g.font = '700 9.5px system-ui'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.fillText(captions[n - 1], fx + fw / 2, top + 3 * s + 13);
  }
}

// "How to beat it" panel on a boss briefing, from y down to just above the start hint. One tip per active skill.

  }
  lab('РАХУНОК', 12, 44);
  g.fillStyle = '#e8eefc'; g.font = '700 26px system-ui'; g.fillText(String(score), 12, 72);
  g.fillStyle = '#6f7d96'; g.font = '11px system-ui'; g.fillText('рекорд ' + best, 130, 72);
  lab('ЕТАП', 12, 92); lab('ІСКРИ', 66, 92); lab('ЗАПОБІЖНИКИ', 130, 92);
  g.fillStyle = '#e8eefc'; g.font = '700 18px system-ui'; g.fillText(run.stage + '/' + STAGES, 12, 110);
  g.fillStyle = '#7fd6ff'; g.fillText('\u25C6 ' + run.sparks, 66, 110);
  drawFuses(130, 96);

  lab('ДАЛІ', 250, 44);
  for (let i = 0; i < queue.length; i++) {
    const s = i === 0 ? 40 : 34, tx = [250, 298, 338][i], ty = 50;
    if (hasMod('fog')) {
      rr(tx + 2, ty + 2, s - 4, s - 4, 6); g.fillStyle = '#10151f'; g.fill();
      g.strokeStyle = '#27344a'; g.lineWidth = 1.5; g.stroke();
      g.fillStyle = '#56637a'; g.font = '700 16px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('?', tx + s / 2, ty + s / 2 + 1); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    } else drawTile(tx, ty, queue[i], s, i === 0 ? 1 : 0.7);
  }
  lab('ЗАПАС', 404, 44);
  rr(404, 50, 52, 52, 6); g.strokeStyle = canHold ? '#2e3d57' : '#5a2a2a'; g.lineWidth = 1.5; g.stroke();
  if (hold) drawTile(404, 50, hold, 52, canHold ? 1 : 0.4);

  lab('ЦІЛЬ', 12, 128);
  g.textAlign = 'right'; g.fillStyle = '#cfd8ea'; g.font = '700 11px system-ui';
  g.fillText(stageScore + ' / ' + goal(), CW - 12, 128);
  if (chainNeed()) {
    const ok = stageMaxChain >= chainNeed();
    g.textAlign = 'center'; g.fillStyle = ok ? '#7dffb0' : '#ff9bd0';
    g.fillText('ЛАНЦЮЖОК \u00d7' + chainNeed() + (ok ? ' \u2713' : ''), CW / 2, 128);
  }
  g.textAlign = 'left';
  g.fillStyle = '#18202e'; rr(12, 132, CW - 24, 6, 3); g.fill();
  const gp = Math.min(1, stageScore / goal());
  if (gp > 0.01) { g.fillStyle = gp >= 1 ? '#7dffb0' : '#ffe066'; rr(12, 132, Math.max(6, (CW - 24) * gp), 6, 3); g.fill(); }
}
function drawControls(now) {
  const y0 = HUD_H + BH, w = CW - 24, half = w / 2 - 10;
  g.fillStyle = '#0d1320'; g.fillRect(0, y0, CW, CTRL_H);
  if (!PLAY_STATES.includes(state)) return;
  lab('НАПРУГА', 12, y0 + 16);
  g.fillStyle = '#18202e'; rr(12, y0 + 20, half, 12, 4); g.fill();
  g.fillStyle = `hsl(${130 - 130 * Math.min(1, volt / 0.9)},85%,55%)`;
  if (volt > 0.01) { rr(12, y0 + 20, Math.max(8, half * volt), 12, 4); g.fill(); }
  const cx0 = 12 + w / 2 + 10;
  lab('ЗАРЯД', cx0, y0 + 16);
  g.textAlign = 'right'; g.fillStyle = '#3de0d0'; g.font = `700 12px ${EMOJI}`; g.fillText('\u26A1'.repeat(charges), cx0 + half, y0 + 16); g.textAlign = 'left';
  g.fillStyle = '#18202e'; rr(cx0, y0 + 20, half, 12, 4); g.fill();
  if (charge > 1) {
    g.globalAlpha = charges > 0 ? 0.75 + 0.25 * Math.sin(now / 150) : 1;
    g.fillStyle = '#3de0d0'; rr(cx0, y0 + 20, Math.max(8, half * charge / 100), 12, 4); g.fill(); g.globalAlpha = 1;
  }
  const bw = (w - 16) / 3, xs = [12, 12 + bw + 8, 12 + 2 * (bw + 8)];
  const powers = run.loadout.map(id => [POWERS[id].icon + ' ' + POWERS[id].name, !!cur && POWERS[id].usable()]);
  powers.forEach(([name, usable], i) => touchButton(xs[i], y0 + 42, bw, 38, name, 'p' + i, charges > 0 && usable, 14));
  if (pick) {                                   // Exchange: the buttons move the cursor
    touchButton(xs[0], y0 + 88, bw, 56, '\u25C0', 'left', true, 24);
    touchButton(xs[1], y0 + 88, bw, 56, '\u25B2', 'rot', true, 24);
    touchButton(xs[2], y0 + 88, bw, 56, '\u25B6', 'right', true, 24);
    touchButton(xs[0], y0 + 152, bw, 44, '\u25BC', 'soft', true, 20);
    touchButton(xs[1], y0 + 152, bw, 44, '\u2714 обмін', 'drop', true, 14);
    touchButton(xs[2], y0 + 152, bw, 44, '\u2716 скасувати', 'hold', true, 13);
  } else {
    touchButton(xs[0], y0 + 88, bw, 56, '\u25C0', 'left', true, 24);
    touchButton(xs[1], y0 + 88, bw, 56, '\u21BB', 'rot', true, 28);
    touchButton(xs[2], y0 + 88, bw, 56, '\u25B6', 'right', true, 24);
    touchButton(xs[0], y0 + 152, bw, 44, '\u25BC швидко', 'soft', true, 14);
    touchButton(xs[1], y0 + 152, bw, 44, '\u25BC\u25BC скинути', 'drop', true, 14);
    touchButton(xs[2], y0 + 152, bw, 44, 'ЗАПАС', 'hold', canHold, 14);
  }
}
function drawHudShop() {
  g.fillStyle = '#0d1320'; g.fillRect(0, 0, CW, HUD_H);
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = '#ffe066'; g.font = '800 16px system-ui'; g.fillText('CIRCUIT DROP', 12, 22);
  if (run.heat) { g.fillStyle = '#ff8a3d'; g.font = `700 12px ${EMOJI}`; g.fillText('\u{1F525} ' + run.heat, 126, 22); }
  lab('РАХУНОК', 12, 52);
  g.fillStyle = '#e8eefc'; g.font = '700 26px system-ui'; g.fillText(String(score), 12, 82);
  lab('ІСКРИ', 190, 52);
  g.fillStyle = '#7fd6ff'; g.font = '700 26px system-ui'; g.fillText('\u25C6 ' + run.sparks, 190, 82);
  lab('ЗАПОБІЖНИКИ', 330, 52);
  drawFuses(330, 62);
  g.fillStyle = '#6f7d96'; g.font = '11px system-ui'; g.fillText('етап ' + run.stage + ' / ' + STAGES + '   \u2022   рекорд ' + best, 12, 112);
}
function drawPerkStrip() {
  const y0 = HUD_H + BH;
  g.fillStyle = '#0d1320'; g.fillRect(0, y0, CW, CTRL_H);
  lab('ВАШІ ПЕРКИ', 12, y0 + 18);
  const own = PERKS.filter(p => pk(p.id) > 0);
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  if (!own.length) { g.fillStyle = '#56637a'; g.font = '12px system-ui'; g.fillText('поки немає', 12, y0 + 42); }
  own.slice(0, 16).forEach((p, i) => {
    g.fillStyle = '#cfd8ea';
    fitText(p.icon + ' ' + p.name + (pk(p.id) > 1 ? ' x' + pk(p.id) : ''), 12 + (i % 2) * (CW / 2), y0 + 42 + ((i / 2) | 0) * 20, CW / 2 - 18, 12);
  });
}

function drawOverlays() {
  const perkCount = PERKS.reduce((n, p) => n + pk(p.id), 0);
  if (state === 'ready') overlay('CIRCUIT DROP', 'З’єднайте + з −, щоб очистити мережу', 'Пройдіть 9 етапів.\nВитрачайте іскри на перки між етапами.\n' + T_START, '#ffe066');
  else if (state === 'over') overlay('КІНЕЦЬ ЗАБІГУ', 'Етап ' + run.stage + ' / ' + STAGES + '   •   Рахунок ' + score, (score > 0 && score >= best ? '★ Новий рекорд!\n' : '') + 'Перків зібрано: ' + perkCount + '\n' + T_NEW, '#ff6a5a');
  else if (state === 'victory') overlay('ЗАБІГ ПРОЙДЕНО!', 'Рахунок ' + score, (score > 0 && score >= best ? '★ Новий рекорд!\n' : '') + 'Перків: ' + perkCount + ', запобіжників: ' + run.fuses + '\n' + T_NEW, '#7dffb0');
  else if (state === 'stagewin') {
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 6; g.strokeStyle = '#000'; g.fillStyle = '#7dffb0'; g.font = '800 34px system-ui';
    g.strokeText(run.stage === STAGES ? 'ФІНАЛ ПРОЙДЕНО!' : 'ЕТАП ПРОЙДЕНО!', WALL + BW / 2, BH / 2);
    g.fillText(run.stage === STAGES ? 'ФІНАЛ ПРОЙДЕНО!' : 'ЕТАП ПРОЙДЕНО!', WALL + BW / 2, BH / 2);
  }
  else if (state === 'briefing') drawBriefing();
  else if (showPerks) drawPerkOverlay();
  else if (paused) overlay('ПАУЗА', T_RESUME, '');
  if (state === 'ready' || state === 'over' || state === 'victory') drawHeatPicker();
}

// Pick 3 of the powers before a run starts.
function drawLoadout() {
  shopHits = [];
  const x0 = WALL + 12, w = BW - 24, cx = WALL + BW / 2;
  g.fillStyle = '#0d1320'; g.fillRect(WALL, 0, BW, BH);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#7fd6ff'; g.font = '800 22px system-ui'; g.fillText('ОБЕРІТЬ 3 СИЛИ', cx, 26);
  g.fillStyle = '#9fb0cc'; g.font = '12px system-ui'; g.fillText('Заряд дає хороша гра. Одна сила = один заряд.', cx, 48);
  POWER_ORDER.forEach((id, i) => {
    const P = POWERS[id], y = 64 + i * 88, h = 80, k = pickSel.indexOf(id), on = k >= 0;
    rr(x0, y, w, h, 10);
    g.fillStyle = on ? '#14322a' : '#151d2b'; g.fill();
    g.lineWidth = 2; g.strokeStyle = on ? '#7dffb0' : '#2a3446'; g.stroke();
    g.textAlign = 'center'; g.font = `30px ${EMOJI}`; g.fillStyle = '#e8eefc'; g.fillText(P.icon, x0 + 36, y + 36);
    g.font = '700 11px system-ui'; g.fillStyle = '#56637a'; g.fillText(kb(i + 1).trim(), x0 + 36, y + 66);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.font = '700 16px system-ui'; g.fillStyle = '#e8eefc'; g.fillText(P.name, x0 + 72, y + 26);
    g.font = '12px system-ui'; g.fillStyle = '#9fb0cc';
    wrap(P.desc, w - 120).forEach((ln, j) => g.fillText(ln, x0 + 72, y + 46 + j * 16));
    if (on) {                                   // slot number the power gets (keys 1-3)
      g.beginPath(); g.arc(x0 + w - 24, y + 24, 14, 0, 7); g.fillStyle = '#7dffb0'; g.fill();
      g.fillStyle = '#06210f'; g.font = '800 15px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(k + 1), x0 + w - 24, y + 25);
    }
    g.textBaseline = 'middle';
    shopHits.push({ x: x0, y, w, h, fn: () => togglePick(id) });
  });
  const by = 64 + 5 * 88 + 4, ok = pickSel.length === 3;
  rr(x0, by, w, 52, 10);
  g.fillStyle = ok ? '#1d3a2a' : '#121823'; g.fill();
  g.lineWidth = 2; g.strokeStyle = ok ? '#7dffb0' : '#232d3f'; g.stroke();
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = ok ? '#e8eefc' : '#56637a'; g.font = '800 16px system-ui';
  g.fillText(ok ? (TOUCH ? 'Почати забіг' : 'Enter \u2014 почати забіг') : 'Оберіть ще ' + (3 - pickSel.length), cx, by + 20);
  g.font = '11px system-ui'; g.fillStyle = ok ? '#9fb0cc' : '#3a4558';
  g.fillText(ok ? 'Сили працюють на клавішах 1, 2, 3 у вказаному порядку' : 'Торкніться сили, щоб обрати або зняти вибір', cx, by + 39);
  shopHits.push({ x: x0, y: by, w, h: 52, fn: startWithLoadout });
}

function draw(now) {
  g.fillStyle = '#0b0f17'; g.fillRect(0, 0, CW, CH);
  uiHits = [];
  g.save(); g.translate(0, boardY);              // everything board-related is drawn in board coordinates
  drawWall(0, true);
  drawWall(WALL + BW, false);
  if (state === 'shop' || state === 'loadout') { (state === 'shop' ? drawShop : drawLoadout)(); if (!portrait) drawShopPanel(); }
  else { drawBoard(now); if (!portrait) drawPanel(now); drawOverlays(); }
  g.restore();
  if (portrait) {
    if (state === 'shop' || state === 'loadout') { drawHudShop(); drawPerkStrip(); }
    else { drawHud(now); drawControls(now); }
  }
}

// ---- Main loop ------------------------------------------------------
grid = emptyGrid(); queue = []; hold = null; canHold = true; bag = [];
score = 0; level = 1; circuits = 0; chain = 0;
let last = performance.now();
const IDLE = ['ready', 'over', 'shop', 'victory', 'briefing', 'loadout'];
function frame(now) {
  const dt = Math.min(50, now - last); last = now;
  if (innerWidth !== layoutW || innerHeight !== layoutH) setLayout();   // also catches mobile URL-bar resizes
  if (!paused && !IDLE.includes(state)) update(dt);
  else if (IDLE.includes(state)) {
    if (state === 'victory' && Math.random() < dt / 120) burst(WALL + Math.random() * BW, Math.random() * BH * 0.7, ['#ffe066', '#7dffb0', '#6db4ff', '#ff9bd0'][(Math.random() * 4) | 0], 12);
    updateFx(dt); animTiles(dt);
  }
  draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
